services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calories
      POSTGRES_USER: calories
      POSTGRES_PASSWORD: calories
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calories"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/calories
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
